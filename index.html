<!DOCTYPE html>
<html>
<head>
    <title>FULLFORM</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#F6F7FB;color:#141414;padding:20px}
        .card{background:#fff;border-radius:12px;padding:24px;max-width:600px;margin:20px auto;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
        h1{color:#0066FF;font-size:28px}
        input,textarea,select{width:100%;padding:10px;margin:8px 0;border:1.5px solid #E3E6EE;border-radius:8px;font-size:14px}
        button{background:#0066FF;color:#fff;padding:12px 20px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin:5px}
        .btn-secondary{background:#EAEBF3;color:#141414}
        .client-card{background:#f8f9fa;border-radius:8px;padding:12px;margin:8px 0;border:1px solid #E3E6EE}
        .flex{display:flex;gap:8px;flex-wrap:wrap}
        .hidden{display:none}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#141414;color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;font-size:14px;z-index:999}
    </style>
</head>
<body>

<div id="app">
    <!-- Login Screen (simple) -->
    <div id="loginScreen" class="card">
        <h1>FULLFORM</h1>
        <p>Enter your name to get started (no password needed)</p>
        <input id="userName" placeholder="Your name (e.g., Dinny)">
        <button onclick="login()">Enter App</button>
    </div>

    <!-- Main App -->
    <div id="mainScreen" class="hidden">
        <div class="card">
            <div class="flex" style="justify-content:space-between;align-items:center;">
                <h1>FULLFORM</h1>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>
            <p>Welcome, <span id="displayName"></span>!</p>
        </div>

        <div class="card">
            <h3>Your Clients</h3>
            <div class="flex">
                <input id="clientName" placeholder="Client name">
                <button onclick="addClient()">Add Client</button>
            </div>
            <div id="clientList"></div>
        </div>

        <div class="card" id="programSection" style="display:none;">
            <h3>Program for <span id="selectedClient"></span></h3>
            <textarea id="programText" placeholder="Paste your program here..."></textarea>
            <button onclick="saveProgram()">Save Program</button>
            <div id="programDisplay"></div>
        </div>
    </div>
</div>

<script>
    // Simple app with local storage
    let currentUser = localStorage.getItem('fullform_user') || '';
    let clients = JSON.parse(localStorage.getItem('fullform_clients')) || [];
    let selectedClientId = null;

    function login() {
        const name = document.getElementById('userName').value.trim();
        if (!name) return alert('Please enter your name');
        currentUser = name;
        localStorage.setItem('fullform_user', name);
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainScreen').classList.remove('hidden');
        document.getElementById('displayName').textContent = name;
        renderClients();
    }

    function logout() {
        localStorage.removeItem('fullform_user');
        location.reload();
    }

    function addClient() {
        const name = document.getElementById('clientName').value.trim();
        if (!name) return alert('Enter a client name');
        clients.push({ id: Date.now(), name, program: '' });
        localStorage.setItem('fullform_clients', JSON.stringify(clients));
        document.getElementById('clientName').value = '';
        renderClients();
    }

    function renderClients() {
        const list = document.getElementById('clientList');
        if (!clients.length) {
            list.innerHTML = '<p>No clients yet. Add one above.</p>';
            return;
        }
        list.innerHTML = clients.map(c => `
            <div class="client-card flex" style="justify-content:space-between;align-items:center;">
                <span><strong>${c.name}</strong> ${c.program ? '📋' : ''}</span>
                <div>
                    <button onclick="selectClient(${c.id})">Program</button>
                    <button onclick="deleteClient(${c.id})" style="background:#E5484D;">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function selectClient(id) {
        selectedClientId = id;
        const client = clients.find(c => c.id === id);
        document.getElementById('selectedClient').textContent = client.name;
        document.getElementById('programText').value = client.program || '';
        document.getElementById('programDisplay').innerHTML = client.program ? `<pre style="background:#f0f0f0;padding:10px;border-radius:8px;">${client.program}</pre>` : '';
        document.getElementById('programSection').style.display = 'block';
    }

    function saveProgram() {
        const text = document.getElementById('programText').value.trim();
        const client = clients.find(c => c.id === selectedClientId);
        if (!client) return;
        client.program = text;
        localStorage.setItem('fullform_clients', JSON.stringify(clients));
        document.getElementById('programDisplay').innerHTML = text ? `<pre style="background:#f0f0f0;padding:10px;border-radius:8px;">${text}</pre>` : '';
        renderClients();
        alert('Program saved!');
    }

    function deleteClient(id) {
        if (!confirm('Delete this client?')) return;
        clients = clients.filter(c => c.id !== id);
        localStorage.setItem('fullform_clients', JSON.stringify(clients));
        if (selectedClientId === id) {
            selectedClientId = null;
            document.getElementById('programSection').style.display = 'none';
        }
        renderClients();
    }

    // Auto-login if user exists
    if (currentUser) {
        document.getElementById('userName').value = currentUser;
        login();
    }
</script>

</body>
</html>
